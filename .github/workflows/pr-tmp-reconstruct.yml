name: pr-tmp-reconstruct

on:
  push:
    branches:
      - fix/serialize-multi-tokenizer-warmup

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact current-main source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import bz2
          import subprocess

          chunks = [
              Path('.pr_tmp/http_server.b64.0').read_text(),
              Path('.pr_tmp/http_server.b64.1').read_text(),
              Path('.pr_tmp/http_server.b64.2').read_text(),
          ]
          target = Path('python/sglang/srt/entrypoints/http_server.py')
          target.write_bytes(bz2.decompress(base64.b64decode(''.join(chunks))))
          actual = subprocess.check_output(['git', 'hash-object', str(target)], text=True).strip()
          expected = 'bbb545f0c914b0330c6cb8d1aeb94e7b694053f1'
          if actual != expected:
              raise SystemExit(f'blob mismatch: {actual} != {expected}')
          print(f'exact blob verified: {actual}')
          PY
      - name: Commit reconstructed source
        shell: bash
        run: |
          if git diff --quiet -- python/sglang/srt/entrypoints/http_server.py; then
            echo 'source already reconstructed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add python/sglang/srt/entrypoints/http_server.py
          git commit -m 'tmp: reconstruct exact warmup source'
          git push origin HEAD:${GITHUB_REF_NAME}
